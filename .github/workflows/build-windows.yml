name: OCMaster C端 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ====== Go CLI test + Go DLL + dotnet publish ======
  build:
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: Setup .NET
        if: matrix.arch == 'amd64'
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Read VERSION
        id: version
        shell: bash
        run: echo "value=$(cat VERSION | tr -d '\n\r ')" >> $GITHUB_OUTPUT

      # ====== Go CLI (静态编译, 双架构) ======
      - name: Build Go CLI (${{ matrix.arch }})
        run: |
          cd c-end\hardware-scanner
          $env:CGO_ENABLED = "0"
          $env:GOARCH = "${{ matrix.arch }}"
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.value }}" -o ..\bin\ocmaster.exe .\cmd\cli
          Write-Host "    ocmaster.exe (${{ matrix.arch }}) static build OK"

      # ====== 测试 (仅 arm64 可执行交叉编译的 bin) ======
      - name: Set UTF-8 encoding
        run: |
          chcp 65001
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

      - name: "1/4 version 测试"
        run: |
          $out = & c-end\bin\ocmaster.exe version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "version failed"; exit 1 }
          Write-Host "    $out"
          Write-Host "PASS: version"

      - name: "2/4 help + scan JSON schema"
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $zh = & c-end\bin\ocmaster.exe help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "help failed"; exit 1 }
          if ($zh -notmatch "ocmaster") { Write-Error "help missing ocmaster"; exit 1 }
          $result = & c-end\bin\ocmaster.exe scan --out json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "scan failed"; exit 1 }
          $json = $result | ConvertFrom-Json
          if (-not $json.cpu.model) { Write-Error "cpu.model empty"; exit 1 }
          if (-not $json.ram.totalCapacity) { Write-Error "ram empty"; exit 1 }
          if (-not $json.gpu.model) { Write-Error "gpu.model empty"; exit 1 }
          Write-Host "    CPU: $($json.cpu.model) ($($json.cpu.cores)C/$($json.cpu.threads)T)"
          Write-Host "PASS: help + JSON schema"

      - name: "3/4 bilingual + table"
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $en = & c-end\bin\ocmaster.exe --lang en-US scan 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "en-US scan failed"; exit 1 }
          if ($en -notmatch "CPU") { Write-Error "en-US missing CPU"; exit 1 }
          $zh = & c-end\bin\ocmaster.exe scan 2>&1 | Out-String
          if ($zh -notmatch "CPU") { Write-Error "zh-CN missing CPU"; exit 1 }
          Write-Host "PASS: bilingual table scan"

      - name: "4/4 error handling"
        run: |
          c-end\bin\ocmaster.exe nosuchcommand 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Error "unknown cmd should fail"; exit 1 }
          Write-Host "PASS: error handling"

      # ====== Go DLL + dotnet publish (仅 amd64, CGO 不能交叉编译 arm64) ======
      - name: Build Go DLL (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          cd c-end\hardware-scanner
          $env:CGO_ENABLED = "1"
          go build -buildmode=c-shared -o ..\bin\hardware_scanner.dll .
          Copy-Item ..\bin\hardware_scanner.dll ..\OCMaster.App\ -Force
          Write-Host "    DLL built"

      - name: dotnet publish (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          cd c-end\OCMaster.App
          dotnet restore
          dotnet publish -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:WindowsAppSDKSelfContained=true `
            -o publish
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $exe = Get-ChildItem publish\OCMaster.App.exe
          Write-Host "    -> $([math]::Round($exe.Length/1MB,1)) MB (GUI+CLI)"

      - name: CLI mode test (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          $result = & c-end\OCMaster.App\publish\OCMaster.App.exe --cli scan --out json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "CLI mode failed"; exit 1 }
          $json = $result | ConvertFrom-Json
          if (-not $json.cpu.model) { Write-Error "cpu.model empty"; exit 1 }
          Write-Host "    CLI mode CPU: $($json.cpu.model)"
          Write-Host "PASS: WinUI exe CLI mode"

      # ====== Rename + Upload ======
      - name: Rename + Upload (${{ matrix.arch }})
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          $name = "ocmaster_${ver}_windows_${{ matrix.arch }}.exe"
          if ("${{ matrix.arch }}" -eq "amd64") {
            Rename-Item c-end\OCMaster.App\publish\OCMaster.App.exe $name
            Move-Item c-end\OCMaster.App\publish\$name c-end\bin\ -Force
          } else {
            Rename-Item c-end\bin\ocmaster.exe $name
          }
          Write-Host "    -> c-end\bin\$name"

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: OCMaster-${{ matrix.arch }}
          path: c-end/bin/ocmaster_*.exe

  # ====== S端测试 ======
  s-end-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Run S端 tests
        run: cd s-end/backend && go test ./... -cover

  # ====== Release ======
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: OCMaster-amd64 }
      - uses: actions/download-artifact@v4
        with: { name: OCMaster-arm64 }

      - name: Read VERSION
        shell: bash
        run: echo "VERSION=$(cat VERSION | tr -d '\n\r ')" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: OCMaster v${{ env.VERSION }}
          files: ocmaster_*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
