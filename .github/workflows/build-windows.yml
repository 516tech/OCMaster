name: Build Windows C端

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ====== Go CLI + DLL 构建与集成测试 ======
  go-build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Read VERSION
        id: version
        shell: bash
        run: echo "value=$(cat VERSION | tr -d '\n\r ')" >> $GITHUB_OUTPUT

      - name: Build Go CLI (ocmaster.exe)
        run: |
          cd c-end\hardware-scanner
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.value }}" -o ..\bin\ocmaster.exe .\cmd\cli

      - name: Build Go DLL (hardware_scanner.dll)
        run: |
          cd c-end\hardware-scanner
          go build -buildmode=c-shared -o ..\bin\hardware_scanner.dll .

      - name: CLI version 测试
        run: |
          c-end\bin\ocmaster.exe version 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Error "version failed"; exit 1 }

      - name: CLI 集成测试 — JSON 输出
        run: |
          $result = & c-end\bin\ocmaster.exe scan --out json 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CLI scan JSON failed: $result"
            exit 1
          }
          $json = $result | ConvertFrom-Json
          Write-Host "CPU: $($json.cpu.model) ($($json.cpu.cores)C/$($json.cpu.threads)T)"
          Write-Host "RAM: $($json.ram.totalCapacity) ($($json.ram.stickCount) sticks)"
          Write-Host "GPU: $($json.gpu.model)"
          Write-Host "MB:  $($json.motherboard.brand) $($json.motherboard.model)"
          # VM/CI 环境: CPU model 非空即可；物理机: cores > 0
          if (-not $json.cpu.model) { Write-Error "CPU model is empty"; exit 1 }
          if ($json.cpu.model -eq "Unknown CPU") {
            Write-Host "=== VM 环境检测，跳过核心数校验 ==="
          } elseif ($json.cpu.cores -eq 0) {
            Write-Error "CPU cores is 0 (非 VM 环境)"
            exit 1
          }
          Write-Host "=== JSON 集成测试 PASS ==="

      - name: CLI 集成测试 — Table 输出
        run: |
          c-end\bin\ocmaster.exe scan 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CLI scan table failed"
            exit 1
          }
          Write-Host "=== Table 集成测试 PASS ==="

      - name: CLI help + 双语测试
        run: |
          c-end\bin\ocmaster.exe help 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Error "zh-CN help failed"; exit 1 }
          c-end\bin\ocmaster.exe --lang en-US help 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Error "en-US help failed"; exit 1 }
          c-end\bin\ocmaster.exe --lang en-US scan 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Error "en-US scan failed"; exit 1 }
          Write-Host "=== 双语测试 PASS ==="

      - name: Upload Go artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OCMaster-Go-CLI
          path: |
            c-end/bin/ocmaster.exe
            c-end/bin/hardware_scanner.dll

  # ====== S端测试 ======
  s-end-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run S端 tests
        run: |
          cd s-end/backend
          go test ./... -cover

  # ====== Release ======
  release:
    needs: go-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OCMaster-Go-CLI

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.go-build.outputs.version }}
          name: OCMaster v${{ needs.go-build.outputs.version }}
          files: |
            ocmaster.exe
            hardware_scanner.dll
          draft: false
          prerelease: false
          generate_release_notes: true
