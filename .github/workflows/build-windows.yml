name: OCMaster C端 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Install MinGW (CGO 编译器)
        run: |
          choco install mingw --no-progress -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          gcc --version

      - name: Read VERSION
        id: version
        shell: bash
        run: echo "value=$(cat VERSION | tr -d '\n\r ')" >> $GITHUB_OUTPUT

      # ====== Go CLI (静态编译, 仅用于集成测试) ======
      - name: Build Go CLI (test-only)
        run: |
          cd c-end\hardware-scanner
          $env:CGO_ENABLED = "0"
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.value }}" -o ..\bin\ocmaster.exe .\cmd\cli

      - name: Set UTF-8 encoding
        run: chcp 65001; [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

      - name: "1/3 Go CLI integration test"
        run: |
          $out = & c-end\bin\ocmaster.exe version 2>&1 | Out-String
          if ($out -notmatch "ocmaster") { throw "version failed" }
          $zh = & c-end\bin\ocmaster.exe help 2>&1 | Out-String
          if ($zh -notmatch "ocmaster") { throw "help failed" }
          $result = & c-end\bin\ocmaster.exe scan --out json 2>&1 | Out-String
          $json = $result | ConvertFrom-Json
          if (-not $json.cpu.model) { throw "scan: cpu.model empty" }
          if (-not $json.ram.totalCapacity) { throw "scan: ram empty" }
          Write-Host "    CPU: $($json.cpu.model) ($($json.cpu.cores)C/$($json.cpu.threads)T)"
          Write-Host "PASS: Go CLI tests"

      - name: "2/3 bilingual + error handling"
        run: |
          $en = & c-end\bin\ocmaster.exe --lang en-US scan 2>&1 | Out-String
          if ($en -notmatch "CPU") { throw "en-US missing CPU" }
          $p = Start-Process -FilePath "c-end\bin\ocmaster.exe" -ArgumentList "nosuchcommand" -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw "unknown cmd should fail" }
          Write-Host "PASS: bilingual + error handling"

      # ====== Go DLL (c-shared, CGO with MinGW) ======
      - name: Build Go DLL (c-shared)
        run: |
          cd c-end\hardware-scanner
          $env:CGO_ENABLED = "1"
          go build -buildmode=c-shared -o ..\bin\hardware_scanner.dll .
          if (-not (Test-Path ..\bin\hardware_scanner.dll)) { throw "Go DLL build failed" }
          Copy-Item ..\bin\hardware_scanner.dll ..\OCMaster.App\ -Force
          Write-Host "    DLL built + copied"

      # ====== dotnet publish (GUI+CLI 双模式) ======
      - name: Install .NET Framework 4.7.2 Developer Pack
        run: |
          choco install netfx-4.7.2-devpack --no-progress -y
          Write-Host ".NET Framework 4.7.2 Developer Pack installed"

      - name: dotnet build (先验证 XAML)
        run: |
          cd c-end\OCMaster.App
          # 清缓存
          if (Test-Path bin) { Remove-Item -Recurse -Force bin }
          if (Test-Path obj) { Remove-Item -Recurse -Force obj }
          dotnet build -c Release -p:Platform=x64 -v normal 2>&1 | Out-String -OutVariable buildOut
          Write-Host $buildOut
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== XAML COMPILER DIAGNOSTICS ==="
            # 1. 先找 obj 目录下的 output.json (精确路径)
            $outputJson = "obj\x64\Release\net8.0-windows10.0.19041.0\win-x64\output.json"
            if (Test-Path $outputJson) {
              Write-Host "--- output.json (XAML errors) ---"
              Get-Content $outputJson
            } else {
              Write-Host "output.json not found at expected path, searching..."
              $errFile = Get-ChildItem -Path obj -Recurse -Filter output.json -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($errFile) { Write-Host "--- output.json (found via search) ---"; Get-Content $errFile.FullName }
              else { Write-Host "No output.json found anywhere in obj/ — XamlCompiler crashed before writing output" }
            }
            # 2. 查看 input.json 了解传给 XamlCompiler 的参数
            $inputJson = "obj\x64\Release\net8.0-windows10.0.19041.0\win-x64\input.json"
            if (Test-Path $inputJson) {
              Write-Host "--- input.json (XAML compiler inputs) ---"
              Get-Content $inputJson
            }
            throw "dotnet build failed"
          }
          Write-Host "    XAML compilation OK"

      - name: dotnet publish (单文件)
        run: |
          cd c-end\OCMaster.App
          dotnet publish -c Release -r win-x64 -p:Platform=x64 `
            -p:PublishSingleFile=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:SelfContained=true `
            -o publish 2>&1 | Select-Object -Last 30
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          $exe = Get-ChildItem publish\OCMaster.App.exe
          Write-Host "    -> $([math]::Round($exe.Length/1MB,1)) MB (GUI+CLI)"

      - name: "3/3 CLI mode test (--cli scan)"
        run: |
          $result = & c-end\OCMaster.App\publish\OCMaster.App.exe --cli scan --out json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "CLI mode failed" }
          $json = $result | ConvertFrom-Json
          if (-not $json.cpu.model) { throw "CLI mode: cpu.model empty" }
          Write-Host "    CLI mode CPU: $($json.cpu.model)"
          Write-Host "PASS: GUI exe CLI mode"

      # ====== Rename + Upload ======
      - name: Rename + Upload
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          $name = "ocmaster_${ver}_windows_amd64.exe"
          Rename-Item c-end\OCMaster.App\publish\OCMaster.App.exe $name
          Move-Item c-end\OCMaster.App\publish\$name c-end\bin\ -Force
          Write-Host "    -> c-end\bin\$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCMaster-Windows
          path: c-end/bin/ocmaster_*.exe

  # ====== S端测试 ======
  s-end-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Run S端 tests
        run: cd s-end/backend && go test ./... -cover

  # ====== Release ======
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: OCMaster-Windows }

      - name: Read VERSION
        shell: bash
        run: echo "VERSION=$(cat VERSION | tr -d '\n\r ')" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: OCMaster v${{ env.VERSION }}
          files: ocmaster_*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
