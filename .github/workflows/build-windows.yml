name: OCMaster C端 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ====== Go CLI → Go DLL → dotnet publish (GUI+CLI 单 exe) ======
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Read VERSION
        id: version
        shell: bash
        run: echo "value=$(cat VERSION | tr -d '\n\r ')" >> $GITHUB_OUTPUT

      # ====== Go CLI (静态编译) ======
      - name: Build Go CLI
        run: |
          cd c-end\hardware-scanner
          $env:CGO_ENABLED = "0"
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.value }}" -o ..\bin\ocmaster.exe .\cmd\cli
          Write-Host "    ocmaster.exe (static)"

      # ====== Go CLI 集成测试 ======
      - name: Set UTF-8 encoding
        run: |
          chcp 65001
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

      - name: "1/4 version 测试"
        run: |
          $out = & c-end\bin\ocmaster.exe version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "version failed"; exit 1 }
          Write-Host "    $out"
          Write-Host "PASS: version"

      - name: "2/4 help + scan JSON schema"
        run: |
          $zh = & c-end\bin\ocmaster.exe help 2>&1 | Out-String
          if ($zh -notmatch "ocmaster") { Write-Error "help missing ocmaster"; exit 1 }
          $result = & c-end\bin\ocmaster.exe scan --out json 2>&1 | Out-String
          $json = $result | ConvertFrom-Json
          $required = @("cpu", "motherboard", "ram", "gpu", "psu", "cooler")
          foreach ($f in $required) {
            if (-not ($json.PSObject.Properties.Name -contains $f)) {
              Write-Error "Missing field: $f"; exit 1
            }
          }
          if (-not $json.cpu.model) { Write-Error "cpu.model empty"; exit 1 }
          if (-not $json.ram.totalCapacity) { Write-Error "ram empty"; exit 1 }
          if ($null -eq $json.ram.sticks) { Write-Error "ram.sticks null"; exit 1 }
          Write-Host "    CPU: $($json.cpu.model) ($($json.cpu.cores)C/$($json.cpu.threads)T)"
          Write-Host "PASS: help + JSON schema"

      - name: "3/4 bilingual + table scan"
        run: |
          $en = & c-end\bin\ocmaster.exe --lang en-US scan 2>&1 | Out-String
          if ($en -notmatch "CPU") { Write-Error "en-US missing CPU"; exit 1 }
          $zh = & c-end\bin\ocmaster.exe scan 2>&1 | Out-String
          if ($zh -notmatch "CPU") { Write-Error "zh-CN missing CPU"; exit 1 }
          Write-Host "PASS: bilingual table scan"

      - name: "4/4 error handling"
        run: |
          c-end\bin\ocmaster.exe nosuchcommand 2>$null
          if ($LASTEXITCODE -eq 0) { throw "unknown cmd should fail" }
          Write-Host "PASS: error handling"

      # ====== Go DLL (c-shared) ======
      - name: Build Go DLL + Copy to C# project
        run: |
          cd c-end\hardware-scanner
          Write-Host "    Checking CGO toolchain..."
          go env CGO_ENABLED CC CXX 2>&1 | Write-Host
          $env:CGO_ENABLED = "1"
          $result = go build -buildmode=c-shared -o ..\bin\hardware_scanner.dll . 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "    go build failed: $result"
            Write-Host "    DLL build skipped — GUI will work without hardware scanning"
            exit 0
          }
          if (-not (Test-Path ..\bin\hardware_scanner.dll)) {
            Write-Host "    DLL not found — GUI will work without hardware scanning"
            exit 0
          }
          Copy-Item ..\bin\hardware_scanner.dll ..\OCMaster.App\ -Force
          Write-Host "    DLL built + copied"

      # ====== WinUI 3 单文件发布 (GUI + CLI 双模式) ======
      - name: dotnet publish (单文件 exe)
        run: |
          cd c-end\OCMaster.App
          dotnet restore
          $result = dotnet publish -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:WindowsAppSDKSelfContained=true `
            -o publish 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "    dotnet publish failed: $result"
            Write-Host "    GUI exe skipped — CLI build will be used for release"
            exit 0
          }
          $exe = Get-ChildItem publish\OCMaster.App.exe
          Write-Host "    -> $([math]::Round($exe.Length/1MB,1)) MB (GUI+CLI)"

      - name: CLI mode test (--cli scan)
        run: |
          $exe = "c-end\OCMaster.App\publish\OCMaster.App.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "    GUI exe not built, skip CLI mode test"
            exit 0
          }
          $result = & $exe --cli scan --out json 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "CLI mode failed"; exit 1 }
          $json = $result | ConvertFrom-Json
          if (-not $json.cpu.model) { Write-Error "cpu.model empty"; exit 1 }
          Write-Host "    CLI mode CPU: $($json.cpu.model)"
          Write-Host "PASS: GUI exe CLI mode"

      # ====== Rename + Upload ======
      - name: Rename + Upload
        run: |
          $pubDir = "c-end\OCMaster.App\publish"
          $guiExe = Get-ChildItem "$pubDir\OCMaster.App.exe" -ErrorAction SilentlyContinue
          $ver = "${{ steps.version.outputs.value }}"
          $name = "ocmaster_${ver}_windows_amd64.exe"
          if ($guiExe) {
            Rename-Item $guiExe.FullName $name
            Move-Item "$pubDir\$name" c-end\bin\ -Force
          } else {
            # Fallback: use Go CLI as release artifact
            Rename-Item c-end\bin\ocmaster.exe $name
          }
          Write-Host "    -> c-end\bin\$name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCMaster-Windows
          path: c-end/bin/ocmaster_*.exe

  # ====== S端测试 ======
  s-end-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Run S端 tests
        run: cd s-end/backend && go test ./... -cover

  # ====== Release ======
  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: OCMaster-Windows }

      - name: Read VERSION
        shell: bash
        run: echo "VERSION=$(cat VERSION | tr -d '\n\r ')" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: OCMaster v${{ env.VERSION }}
          files: ocmaster_*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
