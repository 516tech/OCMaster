name: OCMaster CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: Read VERSION
        id: version
        shell: bash
        run: echo "value=$(cat VERSION | tr -d '\n\r ')" >> $GITHUB_OUTPUT

      - name: Build Go CLI (static)
        run: |
          cd c-end/hardware-scanner
          $env:CGO_ENABLED = "0"
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.value }}" -o ..\bin\ocmaster.exe .\cmd\cli

      - name: Go test
        run: cd c-end/hardware-scanner && go test ./scanner/... -cover

      - name: CLI JSON integration test
        run: |
          $result = & c-end\bin\ocmaster.exe scan --out json 2>&1 | Out-String
          $json = $result | ConvertFrom-Json
          if (-not $json.cpu.model) { throw "cpu.model empty" }
          Write-Host "CPU: $($json.cpu.model) ($($json.cpu.cores)C/$($json.cpu.threads)T)"

      - name: Install MinGW (CGO)
        run: choco install mingw --no-progress -y

      - name: Build Go GUI (CGO)
        run: |
          cd c-end/hardware-scanner
          $env:CGO_ENABLED = "1"
          go build -ldflags="-s -w -H windowsgui -X main.version=${{ steps.version.outputs.value }}" -o ..\bin\ocmaster-gui.exe .\cmd\gui

      - name: Rename + Upload artifact
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          $name = "ocmaster_${ver}_windows_amd64.exe"
          # GUI binary is the main release artifact
          Copy-Item c-end\bin\ocmaster-gui.exe c-end\bin\$name
          Write-Host "  -> $name"

      - uses: actions/upload-artifact@v4
        with:
          name: OCMaster-Windows
          path: c-end/bin/ocmaster_*.exe

  s-end-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - run: cd s-end/backend && go test ./... -cover

  release:
    needs: [build, s-end-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OCMaster-Windows
      - name: Read VERSION
        shell: bash
        run: echo "VERSION=$(cat VERSION | tr -d '\n\r ')" >> $GITHUB_ENV
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: OCMaster v${{ env.VERSION }}
          files: ocmaster_*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
