name: OCMaster C端 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ====== 构建 Windows amd64 ======
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Read VERSION
        id: version
        shell: bash
        run: echo "value=$(cat VERSION | tr -d '\n\r ')" >> $GITHUB_OUTPUT

      # ====== Go CLI 编译 + 测试 ======
      - name: Build Go CLI
        run: |
          cd c-end/hardware-scanner
          $env:CGO_ENABLED = "0"
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.value }}" -o ..\bin\ocmaster.exe .\cmd\cli

      - name: Go test
        run: cd c-end/hardware-scanner && go test ./scanner/... -cover

      - name: Go CLI JSON integration test
        run: |
          $result = & c-end\bin\ocmaster.exe scan --out json 2>&1 | Out-String
          $json = $result | ConvertFrom-Json
          if (-not $json.cpu.model) { throw "cpu.model empty: integration test failed" }
          Write-Host "    CPU: $($json.cpu.model) ($($json.cpu.cores)C/$($json.cpu.threads)T)"

      # ====== Electron 编译 + 打包 ======
      - name: Sync VERSION → package.json
        run: |
          node -e "const p=require('./c-end/electron/package.json');const v=require('fs').readFileSync('VERSION','utf8').trim();p.version=v;require('fs').writeFileSync('./c-end/electron/package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install npm deps
        run: cd c-end/electron && npm ci

      - name: Build Electron
        run: cd c-end/electron && npm run build

      - name: Package Electron (portable exe)
        run: cd c-end/electron && npx electron-builder --win portable --publish=never

      - name: Rename artifact (Go 命名规范)
        run: |
          $ver = "${{ steps.version.outputs.value }}"
          $name = "ocmaster_${ver}_windows_amd64.exe"
          $exe = Get-ChildItem c-end\electron\build\*.exe | Select-Object -First 1
          Rename-Item $exe.FullName $name
          Move-Item (Join-Path $exe.DirectoryName $name) c-end\bin\$name -Force
          Write-Host "    -> $name"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OCMaster-Windows
          path: c-end/bin/ocmaster_*.exe

  # ====== S端 测试 ======
  s-end-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Run S端 tests
        run: cd s-end/backend && go test ./... -cover

  # ====== Release ======
  release:
    needs: [build, s-end-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OCMaster-Windows

      - name: Read VERSION
        shell: bash
        run: echo "VERSION=$(cat VERSION | tr -d '\n\r ')" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: OCMaster v${{ env.VERSION }}
          files: ocmaster_*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
