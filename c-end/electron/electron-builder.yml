appId: com.ocmaster.app
productName: OCMaster
copyright: OCMaster

files:
  - out/**/*
extraResources:
  - from: ../bin/ocmaster.exe
    to: scanner/ocmaster.exe

win:
  target:
    - portable
    - nsis
  artifactName: ocmaster_${version}_windows_amd64.${ext}

mac:
  target:
    - dmg
  artifactName: ocmaster_${version}_darwin_arm64.${ext}
  category: public.app-category.utilities

linux:
  target:
    - AppImage
  artifactName: ocmaster_${version}_linux_amd64.${ext}
  category: Utility

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
